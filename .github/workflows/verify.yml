name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-publication.mjs
      - run: node tests/deepseek-flow.mjs
      - run: node tests/navigation-keeper.mjs
      - run: node tests/local-service-startup.mjs
